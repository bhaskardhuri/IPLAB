<!-- index.html -->

<!DOCTYPE html>
<html lang="en" ng-app="xmlApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AngularJS XML and HTTP</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="StudentController">

    <div class="container">

        <h1>Student Management System</h1>

        <h2>Student Data from XML</h2>

        <button ng-click="getStudents()">
            GET Student Data
        </button>

        <br><br>

        <table border="1" ng-if="students.length > 0">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Branch</th>
                <th>Marks</th>
            </tr>

            <tr ng-repeat="student in students">

                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.branch }}</td>
                <td>{{ student.marks }}</td>

            </tr>

        </table>

        <hr>

        <h2>Send Student Data using POST</h2>

        <form ng-submit="addStudent()">

            <label>Student ID:</label>
            <input type="text" ng-model="newStudent.id" required>

            <label>Name:</label>
            <input type="text" ng-model="newStudent.name" required>

            <label>Branch:</label>
            <input type="text" ng-model="newStudent.branch" required>

            <label>Marks:</label>
            <input type="number" ng-model="newStudent.marks" required>

            <button type="submit">
                POST Student Data
            </button>

        </form>

        <p class="message">
            {{ message }}
        </p>

    </div>

    <script src="app.js"></script>

</body>

</html>
